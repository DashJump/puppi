# Kept for a later Actions publish. The first publish does not use this
# workflow. From a checkout, run `pnpm publish:dry-run`, then
# `pnpm publish:packages` with NPM_TOKEN set in the environment.
# Provenance stays off. A push or a tag does not publish.
name: Publish packages

on:
  workflow_dispatch:

concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Refuse a branch other than master
        if: github.ref != 'refs/heads/master'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "Publish runs from master. This ref is ${REF}."
          exit 1

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: pnpm

      - name: Require npm 11.5.1
        run: |
          node --input-type=module -e 'import { execSync } from "node:child_process"; const v = execSync("npm -v", { encoding: "utf8" }).trim(); const [major, minor] = v.split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) { console.error("npm " + v + " is below 11.5.1"); process.exit(1); } console.log("npm " + v);'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build public packages
        run: node .github/scripts/publish-packages.mjs --build

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node .github/scripts/publish-packages.mjs
